<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusFix - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 92%;
            max-width: 430px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-button {
            flex: 1;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            background: white;
            color: #333;
            cursor: pointer;
            font-size: 15px;
        }

        .role-button.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .demo-info {
            margin-top: 20px;
            padding: 12px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 13px;
            color: #666;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="login-card">

    <div class="logo">
        CampusFix
    </div>

    <p class="subtitle">
        Campus Issue Management System
    </p>


    <div class="role-buttons">

        <button
            class="role-button active"
            id="studentButton"
            onclick="selectRole('student')"
        >
            Student
        </button>


        <button
            class="role-button"
            id="adminButton"
            onclick="selectRole('admin')"
        >
            Admin
        </button>

    </div>

   
    <input
    type="email"
    id="email"
    placeholder="Email Address"
    autocomplete="new-password"
    required
>


    <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password"
>

    <button
        class="login-button"
        onclick="login()"
    >
        Login
    </button>


    <p id="message"></p>


    <div class="register-link">

        New student?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <div class="demo-info">

        Select your account type before logging in.

    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000";

let selectedRole =
    "student";


function selectRole(role) {

    selectedRole = role;

    const studentButton =
        document.getElementById("studentButton");

    const adminButton =
        document.getElementById("adminButton");


    if (role === "student") {

        studentButton.classList.add("active");

        adminButton.classList.remove("active");

    } else {

        adminButton.classList.add("active");

        studentButton.classList.remove("active");

    }

}


async function login() {

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const message =
        document.getElementById("message");


    if (!email || !password) {

        message.textContent =
            "Please enter email and password.";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/login`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email,
                            password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.message ||
                "Login failed.";

            return;
        }


        if (
            selectedRole !==
            data.user.role
        ) {

            message.textContent =
                `This account is registered as ${data.user.role}.`;

            return;
        }


        localStorage.setItem(
            "token",
            data.token
        );


        localStorage.setItem(
            "user",
            JSON.stringify(data.user)
        );


        message.textContent =
            "Login successful!";


        setTimeout(() => {

            if (data.user.role === "admin") {

                window.location.href =
                    "admin.html";

            } else {

                window.location.href = "student.html";

            }

        }, 500);


    } catch (error) {

        console.log(error);

        message.textContent =
            "Unable to connect to server.";

    }

}

</script>


</body>

</html>
