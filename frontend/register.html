<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusFix - Create Account</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background: white;
            width: 92%;
            max-width: 430px;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;

            font-size: 34px;
            font-weight: bold;

            color: #2563eb;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .register-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .register-button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;

            text-align: center;

            font-weight: bold;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #666;
        }

        .login-link a {
            color: #2563eb;

            text-decoration: none;

            font-weight: bold;
        }

        .info {
            margin-top: 20px;

            padding: 12px;

            background: #f1f5f9;

            border-radius: 8px;

            font-size: 13px;

            color: #666;

            text-align: center;
        }

    </style>

</head>


<body>


<div class="register-card">

    <div class="logo">
        CampusFix
    </div>


    <p class="subtitle">
        Create your student account
    </p>


    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >


    <input
        type="email"
        id="email"
        placeholder="Email Address"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button
        class="register-button"
        onclick="register()"
    >
        Create Account
    </button>


    <p id="message"></p>


    <div class="login-link">

        Already have an account?

        <a href="login.html">
            Login
        </a>

    </div>


    <div class="info">

        Create a student account to report
        and track campus issues.

    </div>

</div>


<script>

const API_URL =
    "http://localhost:5000";


async function register() {

    const name =
        document.getElementById("name")
            .value.trim();

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const message =
        document.getElementById("message");


    if (!name || !email || !password) {

        message.textContent =
            "Please fill all fields.";

        return;
    }


    if (password.length < 6) {

        message.textContent =
            "Password must be at least 6 characters.";

        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/api/auth/register`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name,
                            email,
                            password
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            message.textContent =
                data.message ||
                "Registration failed.";

            return;
        }


        message.textContent =
            "Account created successfully!";


        setTimeout(() => {

            window.location.href =
                "login.html";

        }, 800);


    } catch (error) {

        console.log(error);

        message.textContent =
            "Unable to connect to server.";

    }

}

</script>


</body>

</html>
